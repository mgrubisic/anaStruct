name: Trigger RTD build

on:
  release:
    types: [published, edited]
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '*.rst'
      - '*.md'
      - 'readthedocs.yml'
      - '.readthedocs.yaml'

jobs:
  trigger-rtd:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Read the Docs build
        env:
          RTDS_WEBHOOK_TOKEN: ${{ secrets.RTDS_WEBHOOK_TOKEN }}
          RTDS_WEBHOOK_URL: ${{ secrets.RTDS_WEBHOOK_URL }}
        run: |
          if [[ -z "$RTDS_WEBHOOK_URL" || -z "$RTDS_WEBHOOK_TOKEN" ]]; then
            echo "::warning::Read the Docs webhook secrets are not configured; skipping the build trigger."
            exit 0
          fi

          curl --fail-with-body --silent --show-error --request POST \
            --data-urlencode "branches=${GITHUB_REF_NAME}" \
            --data-urlencode "token=${RTDS_WEBHOOK_TOKEN}" \
            "$RTDS_WEBHOOK_URL"